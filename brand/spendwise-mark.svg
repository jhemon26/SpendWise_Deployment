<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SpendWise">
  <!--
    SOURCE OF TRUTH for every SpendWise icon. The app icons, favicon and the
    boot splash are all generated from or copied out of this file — if they are
    ever redrawn separately they drift, which is how the old mark ended up
    looking different in the tab and on the home screen.

    An SW lettermark where the W is also a chart trace: two falls and two
    rises, with the accent on the live end. The W is the only letter in the
    name that can carry meaning as well as spell it, so it does both jobs.

    Ink-on-dark rather than a saturated fill, because every other budgeting app
    is a bright square. Equal cap height on both letters — with the W any
    shorter it reads "Sw".
  -->
  <defs>
    <linearGradient id="sw-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141726"/>
      <stop offset="1" stop-color="#08080d"/>
    </linearGradient>
    <radialGradient id="sw-bloom" cx=".26" cy=".2" r=".75">
      <stop offset="0" stop-color="#c2d6e8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c2d6e8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#sw-tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#sw-bloom)"/>
  <path d="M206 186a48 48 0 1 0-48 48 48 48 0 1 1-48 48" fill="none" stroke="#c2d6e8"
        stroke-width="42" stroke-linecap="round"/>
  <path d="M262 140 302 330 344 226 386 330 426 140" fill="none" stroke="#c2d6e8"
        stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="426" cy="140" r="25" fill="#9fc7b2"/>
</svg>
