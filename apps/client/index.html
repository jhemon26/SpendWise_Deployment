<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SpendWise</title>
<meta name="description" content="SpendWise — know what you can spend today.">
<meta name="theme-color" content="#08080D">
<!-- Installed-app behaviour on iOS: full screen, no Safari chrome, and the
     name under the home-screen icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpendWise">
<link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/ibm-plex-mono-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png?v=3">
<!-- SVG first: crisp at every tab size. The PNG stays for browsers
     that ignore it, and both are generated from brand/spendwise-mark.svg. -->
<link rel="icon" type="image/svg+xml" href="/logo.svg?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=3">
</head>
<body>
<div id="root">
  <!--
    Painted with the HTML, before any JavaScript runs.

    Between parsing and React mounting, #root was empty — a blank frame on every
    launch, which is what makes a web app feel like a web page. React's own
    splash is identical, so when it takes over nothing moves and the two read as
    one screen.

    Inline styles on purpose: this must survive the stylesheet not having
    arrived yet.
  -->
  <div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;
       background:radial-gradient(circle at 9% 8%,rgba(194,214,232,.11),transparent 31rem),radial-gradient(circle at 86% 18%,rgba(159,199,178,.075),transparent 28rem),radial-gradient(circle at 70% 92%,rgba(217,184,162,.055),transparent 32rem),linear-gradient(180deg,#08080d 0%,#0b0b12 48%,#07070b 100%);font-family:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif">
    <div style="display:grid;justify-items:center;gap:18px">
      <svg viewBox="0 0 512 512" width="88" height="88" aria-label="SpendWise" role="img">
        <defs>
          <linearGradient id="bootg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#141726"/><stop offset="1" stop-color="#08080d"/>
          </linearGradient>
          <radialGradient id="bootb" cx=".26" cy=".2" r=".75">
            <stop offset="0" stop-color="#c2d6e8" stop-opacity=".22"/>
            <stop offset="1" stop-color="#c2d6e8" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#bootg)"/>
        <rect width="512" height="512" rx="116" fill="url(#bootb)"/>
        <path d="M206 186a48 48 0 1 0-48 48 48 48 0 1 1-48 48" fill="none" stroke="#c2d6e8"
              stroke-width="42" stroke-linecap="round"/>
        <path d="M262 140 302 330 344 226 386 330 426 140" fill="none" stroke="#c2d6e8"
              stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="426" cy="140" r="25" fill="#9fc7b2"/>
      </svg>
      <div style="font-size:22px;font-weight:800;letter-spacing:-.03em;color:#f1f1f7">SpendWise</div>
      <div style="width:120px;height:3px;border-radius:2px;background:rgba(241,241,247,.10);overflow:hidden">
        <div style="width:40%;height:100%;border-radius:2px;background:#c2d6e8;
             animation:bootbar 1.1s ease-in-out infinite"></div>
      </div>
    </div>
  </div>
  <style>
    @keyframes bootbar { 0%{transform:translateX(-100%)} 100%{transform:translateX(320%)} }
    @media (prefers-reduced-motion: reduce) { #boot [style*="bootbar"] { animation: none } }
  </style>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
