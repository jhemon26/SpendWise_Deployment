<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SpendWise</title>
<meta name="description" content="SpendWise — know what you can spend today.">
<meta name="theme-color" content="#0D1016">
<!-- Installed-app behaviour on iOS: full screen, no Safari chrome, and the
     name under the home-screen icon. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SpendWise">
<link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png?v=2">
<!-- SVG first: crisp at every tab size. The PNG stays for browsers
     that ignore it, and both are generated from brand/spendwise-mark.svg. -->
<link rel="icon" type="image/svg+xml" href="/logo.svg?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png?v=2">
</head>
<body>
<div id="root">
  <!--
    Painted with the HTML, before any JavaScript runs.

    Between parsing and React mounting, #root was empty — a blank frame on every
    launch, which is what makes a web app feel like a web page. React's own
    splash is identical, so when it takes over nothing moves and the two read as
    one screen.

    Inline styles on purpose: this must survive the stylesheet not having
    arrived yet.
  -->
  <div id="boot" style="position:fixed;inset:0;display:grid;place-items:center;
       background:#0d1016;font-family:'Plus Jakarta Sans',-apple-system,system-ui,sans-serif">
    <div style="display:grid;justify-items:center;gap:18px">
      <svg viewBox="0 0 512 512" width="88" height="88" aria-label="SpendWise" role="img">
        <defs>
          <linearGradient id="bootg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#bootg)"/>
        <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="46"/>
        <circle cx="256" cy="256" r="140" fill="none" stroke="#FFFFFF" stroke-width="46"
                stroke-linecap="round" stroke-dasharray="616 264" transform="rotate(-90 256 256)"/>
        <circle cx="123" cy="299" r="20" fill="#22D3EE"/>
      </svg>
      <div style="font-size:22px;font-weight:800;letter-spacing:-.03em;color:#f2f5f9">SpendWise</div>
      <div style="width:120px;height:3px;border-radius:2px;background:rgba(255,255,255,.10);overflow:hidden">
        <div style="width:40%;height:100%;border-radius:2px;background:#6366F1;
             animation:bootbar 1.1s ease-in-out infinite"></div>
      </div>
    </div>
  </div>
  <style>
    @keyframes bootbar { 0%{transform:translateX(-100%)} 100%{transform:translateX(320%)} }
    @media (prefers-reduced-motion: reduce) { #boot [style*="bootbar"] { animation: none } }
  </style>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
