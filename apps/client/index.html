<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SpendWise</title>
<meta name="description" content="SpendWise — know what you can spend today.">
<meta name="theme-color" content="#06070A">
<link rel="preload" href="/fonts/plus-jakarta-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
</head>
<body>
<script>
  /* Applied before first paint. Without this the page renders with the default
     dark tokens and then snaps to light once React mounts — a full-screen flash
     on every load for anyone who chose light. Kept tiny and inline for the same
     reason: an external file would arrive too late. */
  (function () {
    try {
      var t = localStorage.getItem('sw.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* private mode: fall back to the OS preference */ }
  })();
</script>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
